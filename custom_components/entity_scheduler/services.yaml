schedule_action:
  name: Schedule Action
  description: Schedule an action (turn_on, turn_off, toggle) for an entity after a certain delay.
  fields:
    entity_id:
      name: Entity
      description: The entity to act on.
      required: true
      selector:
        entity:
    action:
      name: Action
      description: The action to perform (e.g., turn_on, turn_off, toggle).
      required: true
      selector:
        select:
          options:
            - turn_on
            - turn_off
            - toggle
    delay_hours:
      name: Delay (hours)
      description: Delay in hours before the action is executed.
      required: false
      selector:
        number:
          min: 0
          max: 24
          unit_of_measurement: hours
          mode: box
    delay_mins:
      name: Delay (minutes)
      description: Delay in minutes before the action is executed.
      required: false
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: minutes
          mode: box
    delay_secs:
      name: Delay (seconds)
      description: Delay in seconds before the action is executed (added to minutes).
      required: false
      selector:
        number:
          min: 0
          max: 59
          unit_of_measurement: seconds
          mode: box
  cancel_schedule:
    name: Cancel Schedule
    description: Cancel an active scheduled action by its ID.
    fields:
      schedule_id:
        name: Schedule ID
        description: The ID of the schedule to cancel.
        required: true
        selector:
          text: {}

add_time:
  name: Add Time
  description: Adds or subtracts time from an active schedule.
  fields:
    schedule_id:
      name: Schedule ID
      description: The unique identifier of the schedule to modify.
      required: true
      example: "e44d2d48-3560-44bb-abd2-8a4db95c2e0b"
      selector:
        text:
    seconds:
      name: Seconds
      description: Number of seconds to add (positive) or subtract (negative).
      required: true
      example: 600
      selector:
        number:
          mode: box
